name: Publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate configured Studionet address
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { address } = JSON.parse(readFileSync('src/deployment.json', 'utf8'));
          if (!/^0x[a-fA-F0-9]{40}$/.test(address)) {
            throw new Error('src/deployment.json must contain a valid EVM contract address');
          }
          NODE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check contract Python syntax
        run: python -m py_compile contracts/rain_relay.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
