name: Studionet Contract Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load configured Studionet address
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { readFileSync } from 'node:fs';
          const { address } = JSON.parse(readFileSync('src/deployment.json', 'utf8'));
          if (!/^0x[a-fA-F0-9]{40}$/.test(address)) {
            throw new Error('src/deployment.json must contain a valid EVM contract address');
          }
          console.log('STUDIONET_CONTRACT_ADDRESS=' + address);
          NODE
      - name: Run replay checks and create/accept live E2E agreement
        if: ${{ github.event_name != 'schedule' }}
        env:
          STUDIONET_FAUCET: "1"
        run: npm run test:contract:smoke
      - name: Settle mature live E2E agreement
        if: ${{ github.event_name == 'schedule' }}
        env:
          STUDIONET_FAUCET: "1"
        run: npm run test:contract:settlement
