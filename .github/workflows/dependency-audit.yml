name: Dependency Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency vulnerability summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (item.via ?? []).map((entry) => typeof entry === 'string' ? entry : {
              title: entry.title, url: entry.url, range: entry.range,
            });
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              via,
              fixAvailable: item.fixAvailable,
            }));
          }
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-security-audit
          path: npm-audit.json
          retention-days: 7
